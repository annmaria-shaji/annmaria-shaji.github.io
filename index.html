<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title">Ann Maria Shaji</title>
<meta name="description" data-i18n-attr="content" data-i18n="meta" content="Computer engineering student @ RWTH Aachen">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f6f3;
    --surface:#ffffff;
    --text:#1a1a18;
    --muted:#6b6a65;
    --line:#e3e1db;
    --accent:#1a1a18;
    --accent-text:#ffffff;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#121211;
      --surface:#1b1b1a;
      --text:#f0efeb;
      --muted:#9d9b94;
      --line:#2e2e2c;
      --accent:#f0efeb;
      --accent-text:#121211;
    }
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:16px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    padding:clamp(1.25rem,5vw,4rem) 1.25rem;
  }

  /* ---------- language toggle ---------- */
  .lang{
    align-self:flex-end;
    display:inline-flex;
    border:1px solid var(--line);
    border-radius:999px;
    background:var(--surface);
    padding:3px;
    margin-bottom:clamp(1.5rem,4vw,2.5rem);
  }
  .lang button{
    font:inherit;
    font-size:.78rem;
    font-weight:500;
    letter-spacing:.04em;
    color:var(--muted);
    background:none;
    border:0;
    padding:.3rem .7rem;
    border-radius:999px;
    cursor:pointer;
    transition:background .18s ease,color .18s ease;
  }
  .lang button[aria-pressed="true"]{
    background:var(--accent);
    color:var(--accent-text);
  }

  /* ---------- card ---------- */
  main{
    width:100%;
    max-width:680px;
    animation:rise .5s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){main{animation:none}}

  .intro{
    display:grid;
    grid-template-columns:118px 1fr;
    gap:clamp(1.25rem,3vw,1.75rem);
    align-items:center;
  }
  @media (max-width:560px){
    .intro{grid-template-columns:1fr;gap:1.5rem}
  }

  .photo{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    max-width:118px;
    border-radius:var(--radius);
    overflow:hidden;
    background:var(--surface);
    border:1px solid var(--line);
    display:grid;
    place-items:center;
  }
  .photo img{width:100%;height:100%;object-fit:cover;display:block}
  .photo .initials{
    font-size:1.6rem;
    font-weight:500;
    color:var(--muted);
    letter-spacing:.02em;
  }

  h1{
    font-size:clamp(1.35rem,4vw,1.6rem);
    font-weight:600;
    letter-spacing:-.02em;
    line-height:1.2;
    margin:0 0 .3rem;
  }
  .role{
    font-family:"JetBrains Mono",ui-monospace,monospace;
    font-size:.72rem;
    color:var(--muted);
    letter-spacing:.01em;
    margin:0 0 .6rem;
  }
  .bio{
    font-size:.86rem;
    line-height:1.55;
    color:var(--muted);
  }
  .bio p{margin:0}

  /* ---------- tech tags ---------- */
  .tags{
    display:flex;
    flex-wrap:wrap;
    gap:.35rem;
    margin:.7rem 0 0;
    padding:0;
    list-style:none;
  }
  .tags li{
    font-family:"JetBrains Mono",ui-monospace,monospace;
    font-size:.68rem;
    color:var(--muted);
    border:1px solid var(--line);
    border-radius:6px;
    padding:.18rem .5rem;
  }

  /* ---------- buttons ---------- */
  .links{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:.75rem;
    margin-top:clamp(1.75rem,5vw,2.5rem);
    padding-top:clamp(1.75rem,5vw,2.5rem);
    border-top:1px solid var(--line);
  }
  @media (max-width:560px){
    .links{grid-template-columns:1fr}
  }
  .btn{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:.65rem;
    font-size:1rem;
    font-weight:500;
    text-align:center;
    text-decoration:none;
    color:var(--text);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:1.6rem 1rem;
    transition:transform .15s ease,border-color .15s ease,opacity .15s ease;
  }
  @media (max-width:560px){
    .btn{flex-direction:row;gap:.6rem;padding:1.15rem 1rem}
  }
  .btn:hover{transform:translateY(-2px);border-color:var(--muted)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn svg{width:24px;height:24px;flex:none}
  .btn-primary{
    background:var(--accent);
    color:var(--accent-text);
    border-color:var(--accent);
  }
  .btn-primary:hover{opacity:.9;border-color:var(--accent)}

  footer{
    margin-top:auto;
    padding-top:3rem;
    font-size:.78rem;
    color:var(--muted);
  }
</style>
</head>
<body>

  <!-- language switch -->
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="true">EN</button>
    <button type="button" data-lang="de" aria-pressed="false">DE</button>
  </div>

  <main>
    <div class="intro">
      <!-- PLACEHOLDER 1 - replace photo.jpg with your image file -->
      <div class="photo">
        <img src="media/annmariashaji-natural.jpg" alt="Ann Maria Shaji" onerror="this.remove();document.getElementById('initials').hidden=false">
        <span class="initials" id="initials" hidden>KM</span>
      </div>

      <div>
        <h1>Ann Maria Shaji</h1>
        <p class="role" data-i18n="role">Computer Engineering &amp; IT · Engineering · Aachen</p>
        <div class="bio">
          <p data-i18n="bio">CE &amp; CE student @ RWTH Aachen. here are some words about me and what I do and so on and so on.</p>
        </div>
        <ul class="tags">
          <li>C++</li><li>Python</li><li>Matlab</li><li>Unity</li><li>MS Office</li><li>Git</li>
        </ul>
      </div>
    </div>

    <nav class="links">
      <!-- PLACEHOLDER 2 - two CV pdfs in the repo; filenames are set in the script below -->
      <a class="btn btn-primary" href="AnnMaria-Shaji-CV-EN.pdf" download data-i18n="cvHref" data-i18n-attr="href">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span data-i18n="cv">Download CV</span>
      </a>

      <!-- PLACEHOLDER 3 - your LinkedIn URL -->
      <a class="btn" href="https://www.linkedin.com/in/ann-maria-shaji-149b29380" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.13 1.45-2.13 2.94v5.67H9.35V9h3.41v1.56h.05a3.74 3.74 0 0 1 3.37-1.85c3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14zm1.78 13.02H3.55V9h3.57v11.45z"/></svg>
        LinkedIn
      </a>

      <!-- PLACEHOLDER 4 - your GitHub URL -->
      <a class="btn" href="https://github.com/annmaria-shaji" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.55v-1.94c-3.2.7-3.88-1.54-3.88-1.54-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .96-.3 3.15 1.18a10.9 10.9 0 0 1 5.74 0c2.18-1.48 3.14-1.18 3.14-1.18.63 1.59.23 2.76.12 3.05.74.81 1.18 1.84 1.18 3.1 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.06.78 2.14v3.17c0 .3.2.66.8.55A11.5 11.5 0 0 0 23.5 12A11.5 11.5 0 0 0 12 .5z"/></svg>
        GitHub
      </a>
    </nav>
  </main>

  <footer>© <span id="year"></span> Ann Maria Shaji</footer>

<script>
(function () {
  "use strict";

  var strings = {
    en: {
      title: "Ann Maria Shaji",
      meta: "Computer engineering student @ RWTH Aachen.",
      role: "Computer Engineering & IT · Engineering · Aachen",
      bio: "CE student @ RWTH Aachen. here are some words about me and what I do and so on and so on.",
      cv: "Download CV",
      cvHref: "AnnMaria-Shaji-CV-EN.pdf"   // <- English CV filename
    },
    de: {
      title: "Ann Maria Shaji",
      meta: "Studium der Computer Engineering @ RWTH Aachen.",
      role: "Computer Engineering & IT · Engineering · Aachen",
      bio: "Studium der Computer Engineering an der RWTH Aachen. ein paar worte ueber mich",
      cv: "Lebenslauf herunterladen",
      cvHref: "AnnMaria-Shaji-CV-DE.pdf"   // <- German CV filename
    }
  };

  var buttons = document.querySelectorAll(".lang button");

  function apply(lang) {
    var dict = strings[lang] || strings.en;

    document.documentElement.lang = lang;
    document.title = dict.title;

    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var key = el.getAttribute("data-i18n");
      if (!(key in dict)) return;
      if (el.hasAttribute("data-i18n-attr")) {
        el.setAttribute(el.getAttribute("data-i18n-attr"), dict[key]);
      } else {
        el.textContent = dict[key];
      }
    });

    buttons.forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
    });
  }

  // 1. a manual choice from a previous visit wins
  // 2. otherwise: German browser -> German, anything else -> English
  function detect() {
    var saved = null;
    try { saved = localStorage.getItem("lang"); } catch (e) {}
    if (saved === "en" || saved === "de") return saved;

    var tags = navigator.languages || [navigator.language || ""];
    for (var i = 0; i < tags.length; i++) {
      if (/^de\b/i.test(tags[i])) return "de";
    }
    return "en";
  }

  buttons.forEach(function (b) {
    b.addEventListener("click", function () {
      var lang = b.dataset.lang;
      try { localStorage.setItem("lang", lang); } catch (e) {}
      apply(lang);
    });
  });

  apply(detect());
  document.getElementById("year").textContent = new Date().getFullYear();
})();
</script>
</body>
</html>
